<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fullscreen Fill</title>
    <style>
      :root {
        color-scheme: dark;
      }

      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        min-width: 320px;
        font: 14px/1.4 system-ui, Segoe UI, sans-serif;
        padding: 14px 16px 16px;
        background: #000000;
        color: #e8eaed;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 600;
      }

      h2 {
        margin: 14px 0 6px;
        font-size: 12px;
        font-weight: 600;
        opacity: 0.9;
      }

      /* Title on the left, the on/off switch on the right. */
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .top h1 {
        margin: 0;
      }

      .switch {
        position: relative;
        flex-shrink: 0;
        display: inline-block;
        width: 38px;
        height: 22px;
        cursor: pointer;
      }

      /* The real checkbox stays, invisible, over the track: clicks, keyboard and
         screen readers all still go to it. */
      .switch input[type="checkbox"] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }

      .switch-track {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: color-mix(in srgb, currentColor 28%, transparent);
        transition: background 0.15s;
        pointer-events: none;
      }

      .switch-track::before {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #e8eaed;
        transition: transform 0.15s;
      }

      .switch input:checked + .switch-track {
        background: #1a73e8;
      }

      .switch input:checked + .switch-track::before {
        transform: translateX(16px);
      }

      .switch input:focus-visible + .switch-track {
        outline: 2px solid #8ab4f8;
        outline-offset: 2px;
      }

      label.row {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        user-select: none;
      }

      label.block {
        display: block;
        margin-top: 8px;
        font-size: 12px;
        opacity: 0.85;
      }

      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin: 0;
      }

      input[type="url"],
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font: inherit;
      }

      .mode-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 10px;
        font-size: 12px;
      }

      .mode-row > span {
        opacity: 0.85;
      }

      .mode-row label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        user-select: none;
      }

      input[type="radio"] {
        width: 16px;
        height: 16px;
        margin: 0;
      }

      .mode-row + .hint {
        margin-top: 4px;
      }

      .limit-grid {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 6px 8px;
        margin-top: 10px;
        font-size: 12px;
      }

      .limit-grid label {
        opacity: 0.85;
      }

      .limit-grid select {
        min-width: 0;
        font: inherit;
        padding: 4px 6px;
      }

      .limit-grid .hint {
        grid-column: 1 / -1;
        margin: 0 0 4px;
      }

      /* The settings page is this page without the parts about the current tab. */
      html.options-view body {
        max-width: 560px;
        margin: 0 auto;
      }

      html.options-view .popup-only,
      html:not(.options-view) .options-only {
        display: none !important;
      }

      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font: inherit;
        resize: vertical;
      }

      label.check {
        margin-top: 10px;
        font-size: 12px;
      }

      #reportPreview {
        margin: 4px 0 0;
        padding: 8px;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font: 11px/1.45 ui-monospace, Consolas, monospace;
        border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
        border-radius: 6px;
      }

      .lang-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        font-size: 12px;
      }

      .lang-row span {
        opacity: 0.85;
      }

      .lang-row select {
        flex: 1;
        min-width: 0;
        font: inherit;
        padding: 4px 6px;
      }

      .add-row {
        display: flex;
        gap: 6px;
        margin-top: 4px;
      }

      .add-row input {
        flex: 1;
        min-width: 0;
      }

      .add-row button {
        flex-shrink: 0;
      }

      #blacklistList {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        max-height: 140px;
        overflow: auto;
      }

      #blacklistList li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 0;
        border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent);
        font-size: 12px;
        word-break: break-all;
      }

      #blacklistList li.empty {
        border-bottom: none;
        opacity: 0.55;
        padding: 4px 0;
      }

      #blacklistList li span {
        flex: 1;
        min-width: 0;
      }

      #blacklistList li button {
        flex-shrink: 0;
        padding: 2px 8px;
        font-size: 11px;
      }

      details {
        margin-top: 12px;
        border-top: 1px solid color-mix(in srgb, currentColor 18%, transparent);
        padding-top: 8px;
      }

      summary {
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        user-select: none;
      }

      summary:hover {
        opacity: 0.85;
      }

      .meta {
        margin: 8px 0 0;
        font-size: 12px;
        opacity: 0.75;
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        flex-wrap: wrap;
      }

      button {
        font: inherit;
        padding: 6px 10px;
        cursor: pointer;
      }

      .choice {
        display: none;
        margin-top: 8px;
        padding: 8px;
        border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
        border-radius: 6px;
        font-size: 12px;
      }

      .choice.visible {
        display: block;
      }

      .choice p {
        margin: 0 0 8px;
        word-break: break-all;
      }

      .hint {
        margin: 6px 0 0;
        font-size: 11px;
        opacity: 0.65;
      }

      #typesPanel #currentType {
        margin: 6px 0 2px;
      }

      #typeList label {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 5px 0;
        cursor: pointer;
        user-select: none;
        font-size: 12px;
      }

      #typeList label.current {
        font-weight: 600;
      }

      #typeList .badge {
        margin-left: auto;
        flex-shrink: 0;
        font-size: 10px;
        font-weight: 600;
        opacity: 0.7;
        border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
        border-radius: 999px;
        padding: 0 6px;
      }

      /*
       * Firefox for Android opens the popup as a full page: finger-sized, and
       * readable at arm's length. Every size is set here rather than scaled,
       * because the desktop rules pin most text to 11-12px.
       */
      @media (max-width: 480px), (pointer: coarse) {
        body {
          min-width: 0;
          font-size: 17px;
          padding: 18px 16px 24px;
        }

        h1 {
          font-size: 21px;
        }

        .top {
          margin-bottom: 14px;
        }

        .switch {
          width: 52px;
          height: 30px;
        }

        .switch-track::before {
          top: 4px;
          left: 4px;
          width: 22px;
          height: 22px;
        }

        .switch input:checked + .switch-track::before {
          transform: translateX(22px);
        }

        input[type="checkbox"],
        input[type="radio"] {
          width: 24px;
          height: 24px;
        }

        .mode-row,
        .limit-grid,
        .lang-row,
        label.block {
          font-size: 17px;
          margin-top: 16px;
        }

        .mode-row {
          flex-wrap: wrap;
          gap: 10px 18px;
        }

        .limit-grid {
          gap: 10px 12px;
        }

        .mode-row > span,
        .limit-grid label,
        .lang-row span,
        label.block {
          opacity: 1;
        }

        .hint {
          font-size: 14px;
          opacity: 0.75;
        }

        .meta {
          font-size: 15px;
        }

        button,
        .lang-row select,
        .limit-grid select,
        input[type="url"],
        input[type="text"] {
          min-height: 44px;
          padding: 8px 12px;
          font-size: 16px;
        }

        details {
          margin-top: 18px;
          padding-top: 10px;
        }

        summary {
          padding: 8px 0;
          font-size: 18px;
        }

        #typeList label {
          padding: 12px 0;
          font-size: 16px;
        }

        #typeList .badge {
          font-size: 12px;
        }

        #blacklistList {
          max-height: none;
        }

        #blacklistList li {
          padding: 12px 0;
          font-size: 16px;
        }

        #blacklistList li button {
          padding: 6px 12px;
          font-size: 15px;
        }

        .choice {
          font-size: 16px;
        }

        textarea {
          padding: 8px 12px;
          font-size: 16px;
        }

        label.check {
          font-size: 16px;
          margin-top: 14px;
        }

        #reportPreview {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <h1>Fullscreen Fill</h1>
      <label class="switch">
        <input
          type="checkbox"
          id="enabled"
          role="switch"
          data-i18n-title="enabled"
          title="Widescreen on"
        />
        <span class="switch-track" aria-hidden="true"></span>
      </label>
    </header>

    <div class="mode-row" role="radiogroup" aria-labelledby="modeLabel">
      <span id="modeLabel" data-i18n="modeLabel">Mode</span>
      <label>
        <input type="radio" name="fillMode" value="stretch" />
        <span data-i18n="modeStretch">Stretch</span>
      </label>
      <label>
        <input type="radio" name="fillMode" value="zoom" />
        <span data-i18n="modeZoom">Zoom</span>
      </label>
    </div>
    <p class="hint" data-i18n="modeHint"></p>

    <div class="limit-grid">
      <label for="minAspect" data-i18n="aspectLabel">Fill from</label>
      <select id="minAspect"></select>
      <p class="hint" data-i18n="aspectHint"></p>

      <label for="stretchLimit" class="stretch-only" data-i18n="limitLabel">
        Stretch up to
      </label>
      <select id="stretchLimit" class="stretch-only"></select>
      <label for="overLimit" class="over-limit" data-i18n="overLabel">
        Beyond that
      </label>
      <select id="overLimit" class="over-limit"></select>
      <p class="hint stretch-only" data-i18n="limitHint"></p>
    </div>

    <label class="lang-row" for="uiLang">
      <span data-i18n="langLabel">Language</span>
      <select id="uiLang"></select>
    </label>

    <details id="typesPanel">
      <summary id="typesSummary" data-i18n="types">Player types</summary>
      <p class="meta popup-only" id="currentType" data-i18n="tabBusy">
        Current tab: checking…
      </p>
      <div id="typeList"></div>
      <p class="hint" data-i18n="typesHint"></p>
      <div class="actions popup-only">
        <button type="button" id="reloadTab" data-i18n="reloadTab">
          Reload page
        </button>
      </div>
    </details>

    <details id="blacklistPanel">
      <summary id="blacklistSummary" data-i18n="blacklist">URL blacklist</summary>
      <div class="add-row">
        <input
          type="text"
          id="blacklistInput"
          data-i18n-placeholder="blacklistPlaceholder"
          spellcheck="false"
          autocomplete="off"
        />
        <button type="button" id="blacklistAdd" data-i18n="add">Add</button>
      </div>
      <div class="actions popup-only">
        <button type="button" id="blacklistCurrent" data-i18n="blockCurrent">
          Block current page
        </button>
      </div>
      <div class="choice popup-only" id="currentChoice" hidden>
        <p id="currentChoiceText"></p>
        <div class="actions">
          <button type="button" id="chooseUrl" data-i18n="chooseUrl">
            This URL only
          </button>
          <button type="button" id="chooseDomain" data-i18n="chooseDomain">
            Whole domain
          </button>
          <button type="button" id="chooseCancel" data-i18n="cancel">
            Cancel
          </button>
        </div>
      </div>
      <ul id="blacklistList"></ul>
      <p class="hint" data-i18n="blacklistHint"></p>
    </details>

    <details id="reportPanel" class="options-only">
      <summary data-i18n="report">Report a problem</summary>
      <label class="block" for="reportText" data-i18n="reportWhat">
        What went wrong?
      </label>
      <textarea id="reportText" rows="4" maxlength="2000"></textarea>
      <label class="block" for="reportDevice" data-i18n="reportDevice">
        Device (optional)
      </label>
      <input
        type="text"
        id="reportDevice"
        maxlength="80"
        data-i18n-placeholder="reportDevicePlaceholder"
        autocomplete="off"
      />
      <label class="row check" id="reportSiteRow" hidden>
        <input type="checkbox" id="reportSite" />
        <span id="reportSiteLabel"></span>
      </label>
      <label class="row check">
        <input type="checkbox" id="reportTech" />
        <span data-i18n="reportTech">Include technical details</span>
      </label>
      <p class="hint" data-i18n="reportTechHint"></p>
      <p class="meta" data-i18n="reportPreviewLabel"></p>
      <pre id="reportPreview"></pre>
      <div class="actions">
        <button type="button" id="reportGithub" data-i18n="reportGithub">
          Report on GitHub
        </button>
        <button type="button" id="reportMail" data-i18n="reportMail">
          Send by email
        </button>
      </div>
      <p class="hint" id="reportPublicHint"></p>
      <p class="meta" id="reportStatus"></p>
    </details>

    <details id="urlCheck">
      <summary data-i18n="urlCheck">URL check</summary>
      <label class="block" for="configUrl" data-i18n="configUrlLabel"></label>
      <input
        type="url"
        id="configUrl"
        placeholder="https://…/config.json"
        spellcheck="false"
      />
      <p class="meta" id="status" data-i18n="configLoading"></p>
      <div class="actions">
        <button type="button" id="refresh" data-i18n="checkNow">
          Check now
        </button>
      </div>
      <p class="hint" data-i18n="urlCheckHint"></p>
    </details>

    <div class="actions popup-only">
      <button type="button" id="reportOpen" data-i18n="reportOpen">
        Report a problem
      </button>
    </div>

    <script src="browser-api.js"></script>
    <script src="i18n.js"></script>
    <script src="config-client.js"></script>
    <script src="report.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
