<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Widescreen Fill</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-width: 320px;
        font: 14px/1.4 system-ui, Segoe UI, sans-serif;
        padding: 14px 16px 16px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 600;
      }

      h2 {
        margin: 14px 0 6px;
        font-size: 12px;
        font-weight: 600;
        opacity: 0.9;
      }

      label.row {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        user-select: none;
      }

      label.block {
        display: block;
        margin-top: 8px;
        font-size: 12px;
        opacity: 0.85;
      }

      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin: 0;
      }

      input[type="url"],
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font: inherit;
      }

      .lang-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        font-size: 12px;
      }

      .lang-row span {
        opacity: 0.85;
      }

      .lang-row select {
        flex: 1;
        min-width: 0;
        font: inherit;
        padding: 4px 6px;
      }

      .add-row {
        display: flex;
        gap: 6px;
        margin-top: 4px;
      }

      .add-row input {
        flex: 1;
        min-width: 0;
      }

      .add-row button {
        flex-shrink: 0;
      }

      #blacklistList {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        max-height: 140px;
        overflow: auto;
      }

      #blacklistList li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 0;
        border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent);
        font-size: 12px;
        word-break: break-all;
      }

      #blacklistList li.empty {
        border-bottom: none;
        opacity: 0.55;
        padding: 4px 0;
      }

      #blacklistList li span {
        flex: 1;
        min-width: 0;
      }

      #blacklistList li button {
        flex-shrink: 0;
        padding: 2px 8px;
        font-size: 11px;
      }

      details {
        margin-top: 12px;
        border-top: 1px solid color-mix(in srgb, currentColor 18%, transparent);
        padding-top: 8px;
      }

      summary {
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        user-select: none;
      }

      summary:hover {
        opacity: 0.85;
      }

      .meta {
        margin: 8px 0 0;
        font-size: 12px;
        opacity: 0.75;
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        flex-wrap: wrap;
      }

      button {
        font: inherit;
        padding: 6px 10px;
        cursor: pointer;
      }

      .choice {
        display: none;
        margin-top: 8px;
        padding: 8px;
        border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
        border-radius: 6px;
        font-size: 12px;
      }

      .choice.visible {
        display: block;
      }

      .choice p {
        margin: 0 0 8px;
        word-break: break-all;
      }

      .hint {
        margin: 6px 0 0;
        font-size: 11px;
        opacity: 0.65;
      }

      #typesPanel #currentType {
        margin: 6px 0 2px;
      }

      #typeList label {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 5px 0;
        cursor: pointer;
        user-select: none;
        font-size: 12px;
      }

      #typeList label.current {
        font-weight: 600;
      }

      #typeList .badge {
        margin-left: auto;
        flex-shrink: 0;
        font-size: 10px;
        font-weight: 600;
        opacity: 0.7;
        border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
        border-radius: 999px;
        padding: 0 6px;
      }
    </style>
  </head>
  <body>
    <h1>Widescreen Fill</h1>
    <label class="row">
      <input type="checkbox" id="enabled" />
      <span data-i18n="enabled">Widescreen on</span>
    </label>

    <label class="lang-row" for="uiLang">
      <span data-i18n="langLabel">Language</span>
      <select id="uiLang"></select>
    </label>

    <details id="typesPanel">
      <summary id="typesSummary" data-i18n="types">Player types</summary>
      <p class="meta" id="currentType" data-i18n="tabBusy">
        Current tab: checking…
      </p>
      <div id="typeList"></div>
      <p class="hint" data-i18n="typesHint"></p>
      <div class="actions">
        <button type="button" id="reloadTab" data-i18n="reloadTab">
          Reload page
        </button>
      </div>
    </details>

    <details id="blacklistPanel">
      <summary id="blacklistSummary" data-i18n="blacklist">URL blacklist</summary>
      <div class="add-row">
        <input
          type="text"
          id="blacklistInput"
          data-i18n-placeholder="blacklistPlaceholder"
          spellcheck="false"
          autocomplete="off"
        />
        <button type="button" id="blacklistAdd" data-i18n="add">Add</button>
      </div>
      <div class="actions">
        <button type="button" id="blacklistCurrent" data-i18n="blockCurrent">
          Block current page
        </button>
      </div>
      <div class="choice" id="currentChoice" hidden>
        <p id="currentChoiceText"></p>
        <div class="actions">
          <button type="button" id="chooseUrl" data-i18n="chooseUrl">
            This URL only
          </button>
          <button type="button" id="chooseDomain" data-i18n="chooseDomain">
            Whole domain
          </button>
          <button type="button" id="chooseCancel" data-i18n="cancel">
            Cancel
          </button>
        </div>
      </div>
      <ul id="blacklistList"></ul>
      <p class="hint" data-i18n="blacklistHint"></p>
    </details>

    <details id="urlCheck">
      <summary data-i18n="urlCheck">URL check</summary>
      <label class="block" for="configUrl" data-i18n="configUrlLabel"></label>
      <input
        type="url"
        id="configUrl"
        placeholder="https://…/config.json"
        spellcheck="false"
      />
      <p class="meta" id="status" data-i18n="configLoading"></p>
      <div class="actions">
        <button type="button" id="refresh" data-i18n="checkNow">
          Check now
        </button>
      </div>
      <p class="hint" data-i18n="urlCheckHint"></p>
    </details>

    <script src="i18n.js"></script>
    <script src="config-client.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
